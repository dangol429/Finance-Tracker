[pytest]
# `tests` on the path so `from tests.conftest import ...` works without the
# suite needing to be an installed package. `.` so `import app` resolves from
# the project root however pytest was invoked.
pythonpath = .
testpaths = tests

# -q: one line per file rather than per test, so a green run is three lines.
# --strict-markers: a typo'd @pytest.mark.slwo becomes an error instead of a
#   silently-ignored decorator that makes a test look filtered when it isn't.
addopts = -q --strict-markers
